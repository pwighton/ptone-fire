# Installs the 'mrd-client', 'mrd-server', 'mrd-stream2h5', 'ptone-offline-batch', 'ptone-plot',
# 'ptone-bulk-motion-eval' and 'ptone-tone-plot' commands (see mrd_commands.py).
# Dependencies come from the conda environment (environment.yml), which installs this repository in
# editable mode ('-e .'), so the commands always run the code in this checkout.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ismrmrd-server"
version = "0.0.0"
requires-python = ">=3.10"

[project.scripts]
mrd-client = "mrd_commands:client"
mrd-server = "mrd_commands:server"
mrd-stream2h5 = "mrd_commands:stream2h5"
ptone-offline-batch = "mrd_commands:ptone_offline_batch"
ptone-plot = "mrd_commands:ptone_plot"
ptone-bulk-motion-eval = "mrd_commands:ptone_bulk_motion_eval"
ptone-tone-plot = "mrd_commands:ptone_tone_plot"

[tool.setuptools]
py-modules = ["mrd_commands"]
