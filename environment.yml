name: mrd
channels:
  - ismrmrd
  - conda-forge
dependencies:
  - python=3.10.14  # Highest supported version by siemens_to_ismrmrd=1.2.13
  - ismrmrd::ismrmrd=1.14.2
  - ismrmrd::siemens_to_ismrmrd=1.2.13
  - boost=1.76.0         # For ismrmrd
  - conda-forge::libxslt>=1.1.33   # older conda-forge build links missing libiconv/ICU 58
  # - libxml2=2.9.12       # For ismrmrd
  # - h5py=3.7.0           # For ismrmrd
  # - matplotlib=3.8.2     # used by rgb.py and provides various visualization tools including colormaps
  # - pydicom=3.0.1        # used by dicom2mrd.py to parse DICOM data
  # - numpy=1.26.0
  # - git=2.30.2
  # - m2-dos2unix=7.3.3    # For fixing line ending issues from Windows
  - pip:
    - ismrmrd==1.15.0
    - h5py==3.16
    - numpy==2.2.6
    - matplotlib==3.10.9
    - pydicom==3.0.2
    - pandas==2.3.3         # ptone/tcl.py (TCL head motion); newest for python 3.10
    - pytest==9.1.1         # tests in ptone/tests
